# ============================================================
#  Market News Alerts — settings
#  Edit this file on GitHub to change what you get alerts about.
#  Lines starting with # are notes and are ignored.
# ============================================================

settings:
  timezone: Europe/Oslo
  # Only look at articles published in the last N hours
  max_age_hours: 6
  # More alerts than this in one run are bundled into one notification
  max_single_alerts_per_run: 4
  # At night, alerts arrive silently (no sound). 24-hour clock, Norwegian time.
  quiet_hours_start: 23
  quiet_hours_end: 7

# ------------------------------------------------------------
#  YOUR WATCHLIST
#  Stocks you own or are watching. You get an alert whenever
#  one of the "match" words appears in a headline.
#  Add or remove companies freely — copy the same layout.
#  market: Oslo or US (used for the filters in the dashboard).
# ------------------------------------------------------------
watchlist:
  # Oslo Børs
  - name: Equinor
    ticker: EQNR
    market: Oslo
    match: [Equinor]
  - name: Aker BP
    ticker: AKRBP
    market: Oslo
    match: [Aker BP]
  - name: Aker
    ticker: AKER
    market: Oslo
    match: [Aker ASA, Nscale, Kjell Inge Røkke]
  - name: Kongsberg Gruppen
    ticker: KOG
    market: Oslo
    match: [Kongsberg Gruppen, Kongsberg Defence]
  - name: DNB
    ticker: DNB
    market: Oslo
    match: [DNB Bank, DNB ASA]
  - name: Mowi
    ticker: MOWI
    market: Oslo
    match: [Mowi]
  # US
  - name: Nvidia
    ticker: NVDA
    market: US
    match: [Nvidia]
  - name: Meta
    ticker: META
    market: US
    match: [Meta Platforms, Zuckerberg]
  - name: Tesla
    ticker: TSLA
    market: US
    match: [Tesla]
  - name: Apple
    ticker: AAPL
    market: US
    match: [Apple Inc, iPhone, Tim Cook]
  - name: Microsoft
    ticker: MSFT
    market: US
    match: [Microsoft]

# ------------------------------------------------------------
#  BIG MARKET NEWS
#  Headlines with these words trigger an alert even if they
#  are not about your watchlist (English and Norwegian).
# ------------------------------------------------------------
important_keywords:
  # Central banks and rates
  - Norges Bank
  - styringsrenten
  - renteheving
  - rentekutt
  - rate hike
  - rate cut
  - Federal Reserve
  - Powell
  - Warsh
  - ECB
  # Oil and geopolitics
  - Brent
  - oljeprisen
  - oil prices
  - OPEC
  - Hormuz
  # Market moves
  - stock market crash
  - sell-off
  - selloff
  - børskrakk
  - kraftig fall
  - record high
  - all-time high
  - rekordhøy
  # Company events
  - profit warning
  - resultatvarsel
  - takeover bid
  - bud på
  - oppkjøp
  - acquisition
  - bankruptcy
  - konkurs

# Headlines with these words are ignored (sports, celebrity etc.)
ignore_keywords:
  - football
  - fotball
  - Premier League
  - Eliteserien
  - horoscope

# ------------------------------------------------------------
#  NEWS SOURCES (free RSS feeds)
#  "Google News" searches are added automatically for every
#  company in your watchlist, which also covers E24, DN,
#  Finansavisen and Reuters headlines.
# ------------------------------------------------------------
feeds:
  - name: NRK
    url: https://www.nrk.no/toppsaker.rss
  - name: NRK siste
    url: https://www.nrk.no/nyheter/siste.rss
  - name: BBC Business
    url: https://feeds.bbci.co.uk/news/business/rss.xml
  - name: BBC World
    url: https://feeds.bbci.co.uk/news/world/rss.xml
  - name: CNBC Top News
    url: https://www.cnbc.com/id/100003114/device/rss/rss.html
  - name: CNBC Markets
    url: https://www.cnbc.com/id/15839069/device/rss/rss.html
  - name: Yahoo Finance
    url: https://finance.yahoo.com/news/rssindex
  - name: MarketWatch
    url: https://feeds.content.dowjones.io/public/rss/mw_topstories
  - name: Federal Reserve
    url: https://www.federalreserve.gov/feeds/press_all.xml
  - name: ECB
    url: https://www.ecb.europa.eu/rss/press.html
  # Google News searches for Norwegian market news
  - name: Oslo Børs (Google News)
    url: https://news.google.com/rss/search?q=%22Oslo+B%C3%B8rs%22+when:1d&hl=no&gl=NO&ceid=NO:no
  - name: Norges Bank (Google News)
    url: https://news.google.com/rss/search?q=%22Norges+Bank%22+rente+when:1d&hl=no&gl=NO&ceid=NO:no
  - name: Markets (Google News)
    url: https://news.google.com/rss/search?q=stock+market+when:1d&hl=en-US&gl=US&ceid=US:en
