name: Market prices

on:
  schedule:
    - cron: "7,37 * * * *"   # twice an hour
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: news-alerts         # same group: never runs at the same time as the news check
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch prices
        run: python prices.py
      - name: Save
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data/markets.json
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "Update prices" --quiet
            git pull --rebase --quiet || true
            git push --quiet
          fi
